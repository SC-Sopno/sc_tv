<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" href="favicon.png">
<title>SC TV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
:root{color-scheme:dark;--bg:#09101d;--panel:#111b2d;--panel2:#17243a;--text:#f3f6ff;--muted:#94a4bd;--accent:#5eead4;--line:#263651;--danger:#fca5a5}
:root.light{color-scheme:light;--bg:#f4f7fb;--panel:#fff;--panel2:#eef3f9;--text:#101827;--muted:#66758a;--accent:#0f9f8b;--line:#d7e0ec;--danger:#dc2626}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#152541 0,#09101d 38%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;transition:background .2s,color .2s}.wrap{width:min(1120px,100%);margin:auto;padding:14px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.brand{display:flex;align-items:center;gap:9px}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--accent);color:#08201d;font-weight:900}.top h1{margin:0;font-size:clamp(18px,4vw,26px);letter-spacing:-.4px}.count{color:var(--muted);font-size:12px}.player{background:rgba(17,27,45,.92);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:0 10px 35px #0003}.light .player{background:rgba(255,255,255,.92);box-shadow:0 10px 35px #0001}.player-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}.player h2{font-size:16px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{font-size:11px;color:#08201d;background:var(--accent);border-radius:999px;padding:4px 8px;white-space:nowrap}.video{width:100%;display:block;aspect-ratio:16/9;background:#03060b;border-radius:10px;max-height:62vh}.status{color:var(--muted);font-size:12px;min-height:18px;margin:7px 2px}.quality-row{display:flex;align-items:center;justify-content:flex-end;gap:7px;margin-top:7px}.quality-label{color:var(--muted);font-size:12px}.quality{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:7px 9px;font-size:12px;min-height:34px;outline:none}.quality:focus{border-color:var(--accent)}.quality:disabled{opacity:.55;cursor:not-allowed}.filters{display:flex;gap:8px;margin-bottom:10px}.filters input,.filters select,.language,.theme{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px 11px;font-size:13px;outline:none;min-height:40px;touch-action:manipulation}.filters input{min-width:0;flex:1}.filters input:focus,.filters select:focus,.language:focus,.theme:focus{border-color:var(--accent)}.channels{background:rgba(17,27,45,.88);border:1px solid var(--line);border-radius:14px;padding:10px}.light .channels{background:rgba(255,255,255,.88)}.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:6px;max-height:52vh;overflow:auto;padding-right:2px}.card{display:flex;align-items:center;gap:8px;min-width:0;border:1px solid transparent;border-radius:9px;padding:7px;cursor:pointer;transition:.15s;background:#101a2b;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.light .card{background:#f3f6fa}.card:hover,.card.active{background:var(--panel2);border-color:#355073}.logo,.initial{width:31px;height:31px;flex:0 0 31px;border-radius:8px}.logo{object-fit:contain;background:#24324a}.initial{display:grid;place-items:center;background:#273854;color:var(--accent);font-size:13px;font-weight:800}.info{min-width:0}.name{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{margin-top:2px;color:var(--muted);font-size:10px}.empty{text-align:center;color:var(--muted);padding:28px;grid-column:1/-1}
@media(max-width:700px){.wrap{width:100%;padding:10px}.top{margin-bottom:9px;align-items:flex-start}.brand{min-width:0;flex:1}.brand-mark{width:30px;height:30px;flex:0 0 30px}.top h1{font-size:clamp(16px,5vw,22px);line-height:1.2}.top>div:last-child{flex-wrap:wrap;justify-content:flex-end;max-width:52%;gap:5px}.count{width:100%;text-align:right}.player{padding:9px;border-radius:12px}.player-head{margin-bottom:7px}.player h2{font-size:15px}.video{border-radius:8px;aspect-ratio:16/9;max-height:none}.quality-row{justify-content:space-between}.quality{flex:1;max-width:170px}.list{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;max-height:55vh}.card{padding:7px;gap:6px;min-height:48px}.name{font-size:12px}.meta{font-size:9px}.logo,.initial{width:28px;height:28px;flex-basis:28px}.filters{gap:6px;flex-wrap:wrap}.filters input{flex:1 1 100%;width:100%}.filters select{flex:1 1 0;max-width:none;min-width:0}.language,.theme{padding:8px 7px;font-size:12px;max-width:105px;min-height:38px}}
@media(max-width:380px){.wrap{padding:8px}.top>div:last-child{max-width:58%}.language,.theme{max-width:88px;font-size:11px}.list{grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}.card{padding:6px}.name{font-size:11px}.meta{font-size:8px}}
@media(min-width:701px){.list{min-height:70px}.filters input,.filters select{min-height:42px}}
</style>
</head>
<body>
<main class="wrap">
<header class="top"><div class="brand"><div class="brand-mark">SC</div><h1 id="appTitle"> TV</h1></div><div style="display:flex;align-items:center;gap:8px"><select id="language" class="language"><option value="bn" selected>বাংলা</option><option value="en">English</option><option value="hi">हिन्दी</option></select><select id="theme" class="theme"><option value="auto" selected>Auto</option><option value="dark">🌙 Dark</option><option value="light">☀️ Light</option></select><span id="count" class="count"></span></div></header>
<section class="player"><div class="player-head"><h2 id="title">একটি চ্যানেল নির্বাচন করুন</h2><span id="badge" class="badge">Live Tv</span></div><video id="video" class="video" controls playsinline></video><div id="status" class="status">নিচের তালিকা থেকে একটি চ্যানেল নির্বাচন করুন।</div><div class="quality-row"><span id="qualityLabel" class="quality-label">Quality</span><select id="quality" class="quality" disabled><option value="-1">Auto</option></select></div></section>
<section class="channels"><div class="filters"><input id="search" placeholder="চ্যানেল খুঁজুন…" autocomplete="off"><select id="country"><option value="all">সব দেশ</option><option value="bd">বাংলাদেশ</option><option value="in">ভারত</option></select></div><div id="list" class="list"></div></section>
</main>
<script>
let data=[],hls=null;const $=id=>document.getElementById(id);
const I18N={
bn:{title:'একটি চ্যানেল নির্বাচন করুন',live:'Live Tv',status:'নিচের তালিকা থেকে একটি চ্যানেল নির্বাচন করুন।',search:'চ্যানেল খুঁজুন…',all:'সব দেশ',bd:'বাংলাদেশ',in:'ভারত',empty:'কোনো চ্যানেল পাওয়া যায়নি',loading:'Stream লোড হচ্ছে…',created:'Create by SC_Sopno ',noUrl:'এই চ্যানেলের stream URL নেই।',ready:'Stream প্রস্তুত। Play চাপুন।',failed:'এই stream ব্রাউজারে চালানো যায়নি।',noHls:'এই ব্রাউজারে HLS playback সমর্থিত নয়।',api:'apis.json লোড করা যায়নি। index.html ও apis.json একই folder-এ রাখুন।',quality:'Quality',auto:'Auto',source:'Source',qualityUnavailable:'Quality পাওয়া যায়নি'},
en:{title:'Select a channel',live:'Live Tv',status:'Select a channel from the list below.',search:'Search channels…',all:'All countries',bd:'Bangladesh',in:'India',empty:'No channels found',loading:'Loading stream…',created:'Create by SC_Sopno ',noUrl:'This channel has no stream URL.',ready:'Stream ready. Press Play.',failed:'This stream could not be played in the browser.',noHls:'HLS playback is not supported in this browser.',api:'Could not load apis.json. Keep index.html and apis.json in the same folder.',quality:'Quality',auto:'Auto',source:'Source',qualityUnavailable:'Quality information unavailable'},
hi:{title:'एक चैनल चुनें',live:'Live Tv',status:'नीचे दी गई सूची से एक चैनल चुनें।',search:'चैनल खोजें…',all:'सभी देश',bd:'बांग्लादेश',in:'भारत',empty:'कोई चैनल नहीं मिला',loading:'स्ट्रीम लोड हो रही है…',created:'Create by SC_Sopno ',noUrl:'इस चैनल का stream URL नहीं है।',ready:'स्ट्रीम तैयार है। Play दबाएँ।',failed:'यह स्ट्रीम ब्राउज़र में नहीं चल सकी।',noHls:'इस ब्राउज़र में HLS playback समर्थित नहीं है।',api:'apis.json लोड नहीं हो सकी। index.html और apis.json को एक ही folder में रखें।',quality:'Quality',auto:'Auto',source:'Source',qualityUnavailable:'Quality जानकारी उपलब्ध नहीं है'}
};
let lang='bn';

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function applyLanguage(){
 const t=I18N[lang];document.documentElement.lang=lang;
 $('appTitle').textContent='India & Bangladesh TV';$('title').textContent=t.title;$('badge').textContent=t.live;
 $('status').textContent=t.status;$('search').placeholder=t.search;$('qualityLabel').textContent=t.quality;
 const co=$('country');co.options[0].textContent=t.all;co.options[1].textContent=t.bd;co.options[2].textContent=t.in;
 if(!hls) resetQuality(); else refreshQualityLabels();render();
}
function applyTheme(){
 const saved=localStorage.getItem('tv-theme')||'auto';
 const isDark=saved==='dark'||(saved==='auto'&&window.matchMedia('(prefers-color-scheme: dark)').matches);
 document.documentElement.classList.toggle('light',!isDark);document.body.classList.toggle('light',!isDark);$('theme').value=saved;
}
function render(){
 const q=$('search').value.toLowerCase().trim(),co=$('country').value;
 const rows=data.filter(c=>(co==='all'||c.country_code===co)&&(!q||c.name.toLowerCase().includes(q)));
 $('count').textContent=`${rows.length}/${data.length}`;
 $('list').innerHTML=rows.length?rows.map(c=>`<div class="card" data-id="${c.id}">${c.logo_url?`<img class="logo" src="${esc(c.logo_url)}" alt="">`:`<div class="initial">${esc(c.name[0])}</div>`}<div class="info"><div class="name">${esc(c.name)}</div><div class="meta">${esc(c.country)} · ${c.streams.length} stream</div></div></div>`).join(''):`<div class="empty">${I18N[lang].empty}</div>`;
 document.querySelectorAll('.card').forEach(x=>x.onclick=()=>openChannel(+x.dataset.id));
}
function openChannel(id){
 const c=data.find(x=>x.id===id);if(!c)return;
 document.querySelectorAll('.card').forEach(x=>x.classList.toggle('active',+x.dataset.id===id));
 $('title').textContent=`${c.name} · ${c.country}`;play(c.streams[0]?.url);window.scrollTo({top:0,behavior:'smooth'});
}
function resetQuality(){
 const q=$('quality');q.innerHTML=`<option value="-1">${I18N[lang].auto}</option>`;q.disabled=true;
}
function refreshQualityLabels(){
 const q=$('quality');if(q.options[0])q.options[0].textContent=I18N[lang].auto;
}
function populateQuality(){
 const q=$('quality');q.innerHTML=`<option value="-1">${I18N[lang].auto}</option>`;
 if(!hls||!hls.levels||!hls.levels.length){q.disabled=true;return}
 const bestByHeight=new Map();
 hls.levels.forEach((level,index)=>{
   const height=Number(level.height)||0;
   if(height>0){
     const old=bestByHeight.get(height);
     if(old===undefined || (Number(level.bitrate)||0)>(Number(hls.levels[old].bitrate)||0)) bestByHeight.set(height,index);
   }
 });
 const levels=[...bestByHeight.entries()].sort((a,b)=>b[0]-a[0]);
 if(!levels.length){
   const o=document.createElement('option');o.value="-1";o.textContent=I18N[lang].source;q.appendChild(o);q.disabled=true;return;
 }
 levels.forEach(([height,index])=>{
   const o=document.createElement('option');o.value=String(index);o.textContent=`${height}p`;q.appendChild(o);
 });
 q.value='-1';q.disabled=false;
}
function play(url){
 resetQuality();
 if(!url){$('status').textContent=I18N[lang].noUrl;return}
 if(hls){hls.destroy();hls=null}
 const v=$('video');v.pause();v.removeAttribute('src');v.load();$('status').textContent=I18N[lang].loading;
 const startPlayback=()=>v.play().catch(()=>{$('status').textContent=I18N[lang].created});
 if(window.Hls&&Hls.isSupported()){
   hls=new Hls();
   hls.loadSource(url);hls.attachMedia(v);
   hls.on(Hls.Events.MANIFEST_PARSED,()=>{populateQuality();startPlayback();$('status').textContent=I18N[lang].created});
   hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal){resetQuality();$('status').textContent=I18N[lang].failed}})
 }else if(v.canPlayType('application/vnd.apple.mpegurl')){
   v.src=url;v.load();v.onloadedmetadata=()=>{startPlayback();$('status').textContent=I18N[lang].created};
 }else $('status').textContent=I18N[lang].noHls;
}
$('quality').onchange=e=>{
 if(!hls)return;
 const idx=Number(e.target.value);
 hls.currentLevel=idx; // -1 = Auto; >=0 = fixed HLS rendition
};
$('search').oninput=render;$('country').onchange=render;
$('language').onchange=e=>{lang=e.target.value;applyLanguage()};
$('theme').onchange=e=>{localStorage.setItem('tv-theme',e.target.value);applyTheme()};
const mediaTheme=window.matchMedia('(prefers-color-scheme: dark)');
mediaTheme.addEventListener?.('change',()=>{if((localStorage.getItem('tv-theme')||'auto')==='auto')applyTheme()});
applyTheme();
fetch('apis.json').then(r=>r.json()).then(x=>{data=x.channels||[];render()}).catch(()=>{$('list').innerHTML=`<div class="empty">${I18N[lang].api}</div>`});
</script>
</body></html>
